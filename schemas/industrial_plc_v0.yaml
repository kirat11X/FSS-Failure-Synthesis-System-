# FSS decoder schema for D3 Industrial PLC domain
schema_set: d3_industrial_plc

enums:
  interlock_reason:
    0: NONE
    1: OVERHEAT
    2: EMERGENCY_STOP
    3: PRESSURE_LOSS
  conveyor_state:
    0: RUNNING
    1: STARVED
    2: BLOCKED
    3: STOPPED

event_types:
  0x0301:
    name: TEMP_STATUS
    version: 1
    fields:
      - {name: sensor_id,      offset: 0, type: u16,  size: 2, endian: little}
      - {name: temperature_c,  offset: 2, type: f32,  size: 4, endian: little}
      - {name: drift_detected, offset: 6, type: bool, size: 1}

  0x0302:
    name: INTERLOCK
    version: 1
    fields:
      - {name: interlock_id, offset: 0, type: u16,  size: 2, endian: little}
      - {name: tripped,      offset: 2, type: bool, size: 1}
      - {name: reason_code,  offset: 3, type: u16,  size: 2, endian: little, enum: interlock_reason, enum_field: reason}

  0x0303:
    name: CONVEYOR_STATE
    version: 1
    fields:
      - {name: conveyor_id, offset: 0, type: u16, size: 2, endian: little}
      - {name: state_code,  offset: 2, type: u8,  size: 1, enum: conveyor_state, enum_field: state}
