[theme]
base = "dark"
primaryColor = "#FF2A85"
backgroundColor = "#070812"
secondaryBackgroundColor = "#0E1126"
textColor = "#E6F1FF"
font = "monospace"

[global]
developmentMode = false

[browser]
gatherUsageStats = false

[server]
headless = true
fileWatcherType = "none"
runOnSave = false
enableXsrfProtection = true
maxCacheDataSize = "1gb"
maxUploadSize = 200

[runner]
fastReruns = true

[client]
showErrorDetails = "type"
toolbarMode = "viewer"
