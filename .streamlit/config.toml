[theme]
base = "dark"
primaryColor = "#34F5A4"
backgroundColor = "#0A0D0C"
secondaryBackgroundColor = "#101514"
textColor = "#E2ECE9"
font = "monospace"

[global]
developmentMode = false

[browser]
gatherUsageStats = false

[server]
headless = true
fileWatcherType = "none"
runOnSave = false
enableXsrfProtection = true
maxCacheDataSize = "1gb"
maxUploadSize = 200

[runner]
fastReruns = true

[client]
showErrorDetails = "type"
toolbarMode = "viewer"
